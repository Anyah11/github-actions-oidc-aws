# For the provider URL : https://token.actions.githubusercontent.com
# For the "Audience" : sts.amazonaws.com
name: AWS OIDC Connect Demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

permissions:
  id-token: write   # lets the workflow request the JWT from GitHub
  contents: read    # lets actions/checkout download the repo

jobs:
  DemoOIDC:
    runs-on: ubuntu-latest
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::444301975580:role/github-actions-oidc-aws-role
          role-session-name: GitHubActionsOIDC
          aws-region: ${{ env.AWS_REGION }}

      - name: Print assumed role
        run: aws sts get-caller-identity

      - name: Read SSM parameter
        run: aws ssm get-parameter --name hello_aws-gh-oidc --query Parameter.Value --output text