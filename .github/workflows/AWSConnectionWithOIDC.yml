# For the provider URL: Use the following URL: https://token.actions.githubusercontent.com
# For the audience: Use the following value: sts.amazonaws.com
name: AWS OIDC Connect Demo
on:
  push:
    branches:
      - main
env:
  AWS_REGION: us-east-1
permissions:
  id-token: write   # This is required for requesting the JWT token from GitHub Actions
  contents: read    # This is required for actions/checkout
jobs:
  DemoOIDC:
    runs-on: ubuntu-latest
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v3

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::444301975580:role/github-actions-oidc-aws-role
          role-session-name: GitHubActionsOIDC
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS credentials
        run: aws ssm get-parameter --name=hello_aws-gh-oidc --query Parameter.Value

      - name: Print assumed role
        run: aws sts get-caller-identity